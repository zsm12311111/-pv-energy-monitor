<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Microsoft YaHei, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .mod { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
    .pin { font-size: 13px; fill: #2a6df4; font-family: Consolas, monospace; }
    .desc { font-size: 12px; fill: #666; }
    .box { fill: #f4f7fb; stroke: #b9c6d8; stroke-width: 1.2; }
    .mcu { fill: #d6e4ff; stroke: #2a6df4; stroke-width: 1.5; }
    .line { stroke: #555; stroke-width: 1.5; }
  </style>

  <text x="380" y="30" text-anchor="middle" class="title">STM32F103C8T6 引脚接线图</text>

  <!-- STM32 框 -->
  <rect x="420" y="50" width="280" height="500" rx="12" class="mcu"/>
  <text x="560" y="80" text-anchor="middle" class="mod">STM32F103C8T6</text>
  <text x="560" y="98" text-anchor="middle" class="desc">Blue Pill 开发板</text>

  <!-- 每根连线：左侧模块 → 右侧引脚 -->
  <!-- 1 OLED SDA -->
  <rect x="40" y="130" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="155" class="mod">OLED（SSD1306）SDA</text>
  <text x="55" y="168" class="desc">I2C 数据线</text>
  <line x1="340" y1="150" x2="420" y2="150" class="line"/>
  <text x="560" y="155" class="pin">PB7</text>

  <!-- 2 OLED SCL -->
  <rect x="40" y="180" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="205" class="mod">OLED（SSD1306）SCL</text>
  <text x="55" y="218" class="desc">I2C 时钟线</text>
  <line x1="340" y1="200" x2="420" y2="200" class="line"/>
  <text x="560" y="205" class="pin">PB6</text>

  <!-- 3 INA226 SDA -->
  <rect x="40" y="230" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="255" class="mod">INA226 SDA</text>
  <text x="55" y="268" class="desc">与 OLED 共用 I2C</text>
  <line x1="340" y1="250" x2="420" y2="250" class="line"/>
  <text x="560" y="255" class="pin">PB7</text>

  <!-- 4 INA226 SCL -->
  <rect x="40" y="280" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="305" class="mod">INA226 SCL</text>
  <text x="55" y="318" class="desc">与 OLED 共用 I2C</text>
  <line x1="340" y1="300" x2="420" y2="300" class="line"/>
  <text x="560" y="305" class="pin">PB6</text>

  <!-- 5 DS18B20 DQ -->
  <rect x="40" y="330" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="355" class="mod">DS18B20 DQ</text>
  <text x="55" y="368" class="desc">DQ↔VCC 加 4.7kΩ 上拉</text>
  <line x1="340" y1="350" x2="420" y2="350" class="line"/>
  <text x="560" y="355" class="pin">PB0</text>

  <!-- 6 按键1 -->
  <rect x="40" y="380" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="405" class="mod">按键 1（下一页）</text>
  <text x="55" y="418" class="desc">另一端接 GND（内部上拉）</text>
  <line x1="340" y1="400" x2="420" y2="400" class="line"/>
  <text x="560" y="405" class="pin">PA1</text>

  <!-- 7 按键2 -->
  <rect x="40" y="430" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="455" class="mod">按键 2（上一页）</text>
  <text x="55" y="468" class="desc">另一端接 GND（内部上拉）</text>
  <line x1="340" y1="450" x2="420" y2="450" class="line"/>
  <text x="560" y="455" class="pin">PA2</text>

  <!-- 8 CH340 TX -->
  <rect x="40" y="480" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="505" class="mod">CH340 TX</text>
  <text x="55" y="518" class="desc">串口发送 → 单片机接收</text>
  <line x1="340" y1="500" x2="420" y2="500" class="line"/>
  <text x="560" y="505" class="pin">PA10 (RX)</text>

  <!-- 9 CH340 RX -->
  <rect x="40" y="530" width="300" height="40" rx="6" class="box"/>
  <text x="55" y="555" class="mod">CH340 RX</text>
  <text x="55" y="568" class="desc">串口接收 ← 单片机发送</text>
  <line x1="340" y1="550" x2="420" y2="550" class="line"/>
  <text x="560" y="555" class="pin">PA9 (TX)</text>

  <!-- 图例 -->
  <text x="380" y="585" text-anchor="middle" class="desc">注：INA226 的 VIN+ 接电池正极、VIN- 接负载；OLED/INA226/DS18B20/按键/CH340 的 VCC 接 3.3V、GND 接 GND</text>
</svg>
