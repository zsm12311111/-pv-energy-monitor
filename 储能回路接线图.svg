<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Microsoft YaHei, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .box { stroke: #333; stroke-width: 1.5; }
    .energy { fill: #fff3cd; stroke: #d4a017; }
    .label { font-size: 14px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .pin { font-size: 12px; fill: #2a6df4; text-anchor: middle; font-family: Consolas, monospace; }
    .arrow { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .pos { stroke: #d43f3f; stroke-width: 2; }
    .neg { stroke: #333; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="410" y="32" text-anchor="middle" class="title">储能回路接线图（子系统二）</text>
  <text x="410" y="52" text-anchor="middle" class="pin">红/实线 = 正极 · 黑/虚线 = 负极</text>

  <!-- 太阳能板 -->
  <rect x="30" y="120" width="150" height="80" rx="8" class="box energy"/>
  <text x="105" y="150" class="label">太阳能板</text>
  <text x="105" y="170" class="pin">正 + / 负 -</text>

  <!-- 充电模块 -->
  <rect x="260" y="110" width="170" height="100" rx="8" class="box energy"/>
  <text x="345" y="138" class="label">充电管理模块</text>
  <text x="345" y="156" class="pin">CN3791 / TP4056</text>
  <text x="345" y="175" class="pin">IN+ IN-</text>
  <text x="345" y="192" class="pin">B+  B-  OUT+  OUT-</text>

  <!-- 电池 -->
  <rect x="510" y="120" width="140" height="80" rx="8" class="box energy"/>
  <text x="580" y="150" class="label">18650 电池</text>
  <text x="580" y="170" class="pin">正 + / 负 -</text>

  <!-- 风扇 -->
  <rect x="700" y="120" width="100" height="80" rx="8" class="box energy"/>
  <text x="750" y="150" class="label">USB 风扇</text>
  <text x="750" y="170" class="pin">正 + / 负 -</text>

  <!-- 连线 -->
  <line x1="180" y1="145" x2="256" y2="145" class="arrow pos"/>
  <line x1="180" y1="175" x2="256" y2="175" class="arrow neg"/>

  <line x1="430" y1="160" x2="506" y2="150" class="arrow pos"/>
  <line x1="430" y1="185" x2="506" y2="175" class="arrow neg"/>

  <line x1="650" y1="150" x2="696" y2="150" class="arrow pos"/>
  <line x1="650" y1="175" x2="696" y2="175" class="arrow neg"/>

  <!-- 标注 -->
  <text x="218" y="135" class="pin" font-size="11">正→IN+</text>
  <text x="218" y="200" class="pin" font-size="11">负→IN-</text>
  <text x="468" y="145" class="pin" font-size="11">B+→电池正</text>
  <text x="468" y="200" class="pin" font-size="11">B-→电池负</text>
  <text x="673" y="135" class="pin" font-size="11">电池正→风扇正</text>
  <text x="673" y="200" class="pin" font-size="11">电池负→风扇负</text>

  <!-- INA226 采样提示 -->
  <rect x="30" y="300" width="770" height="70" rx="8" fill="#f0f7ff" stroke="#2a6df4" stroke-width="1.2"/>
  <text x="415" y="325" text-anchor="middle" class="label">电流采样（INA226）串联方式</text>
  <text x="415" y="348" text-anchor="middle" class="pin">把要测的电流串进 VIN+ 和 VIN-：电池正极 → INA226 VIN+ → VIN- → 负载</text>

  <!-- 安全提示 -->
  <rect x="30" y="385" width="770" height="45" rx="8" fill="#fff0f0" stroke="#d43f3f" stroke-width="1.2"/>
  <text x="415" y="412" text-anchor="middle" class="pin" fill="#d43f3f">⚠ 18650 必须用带保护板的正规电芯；先断电再改线；严禁直接短路电池两极</text>
</svg>
